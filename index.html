<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in Cloud Run iframe preview
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) + '';
        var file = (event && (event.filename || '')) + '';
        if (file.indexOf('@vite/client') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason) || '';
        var reasonStr = (reason && (reason.stack || reason.message || reason)) + '';
        if (reasonStr.indexOf('@vite/client') !== -1 || reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <title>Digital Sahayak (डिजिटल सहायक) — Unified Citizen Grievances &amp; System Navigator</title>
    <meta name="description" content="Unified citizen grievance and system navigator for Indian government portals with step-by-step guidance, KB photo resizer, and visual error decoder." />
    <meta property="og:title" content="Digital Sahayak (डिजिटल सहायक)" />
    <meta property="og:description" content="Unified citizen grievance and system navigator for Indian government portals with step-by-step guidance, KB photo resizer, and visual error decoder." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <!-- Google Fonts: Inter + Regional Indian Script Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+Bengali:wght@400;500;600;700&amp;family=Noto+Sans+Devanagari:wght@400;500;600;700&amp;family=Noto+Sans+Gujarati:wght@400;500;600;700&amp;family=Noto+Sans+Kannada:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;600;700&amp;family=Noto+Sans+Telugu:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <!-- Initialize Light/Dark Mode before DOM renders to prevent flicker: Default Light -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('digital-sahayak-theme');
          var isDark = saved === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
